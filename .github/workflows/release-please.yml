name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}.${{ needs.release-please.outputs.patch }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-release-${{ env.TAG }}
          restore-keys: |
            ${{ runner.os }}-maven-release-
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn -B verify

      - name: Deploy to GitHub Packages
        run: mvn -B -ntp deploy -DskipTests -Dmaven.javadoc.failOnError=false

      - name: Upload .hpi to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" target/jenkins-pipeline-cache.hpi --filename "jenkins-pipeline-cache-${VERSION}.hpi"

      - name: Update version in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'

          sed -i -E "s|https://github.com/TwoStone/jenkins-pipeline-cache-plugin/releases/download/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.hpi|https://github.com/TwoStone/jenkins-pipeline-cache-plugin/releases/download/${TAG}/jenkins-pipeline-cache-${VERSION}.hpi|g" README.md

          if git diff --quiet README.md; then
            echo "::notice::README.md already up to date"
          else
            # Use the `chore` type so release-please does not treat this commit
            # as a releasable change and open a follow-up release PR.
            git add README.md
            git commit -m "chore(release): update README download link to v${VERSION}"
            git push
          fi
