name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re-)publish, e.g. v1.1.2'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always() lets this run on workflow_dispatch, where release-please is skipped.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

    steps:
      - name: Resolve version from tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::TAG '$TAG' is not of the form vX.Y.Z"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Publishing ${TAG#v} (tag: $TAG)"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-release-${{ env.TAG }}
          restore-keys: |
            ${{ runner.os }}-maven-release-
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn -B verify

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp deploy -DskipTests -Dmaven.javadoc.failOnError=false

      - name: Upload .hpi to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/jenkins-pipeline-cache.hpi "target/jenkins-pipeline-cache-${VERSION}.hpi"
          gh release upload "$TAG" "target/jenkins-pipeline-cache-${VERSION}.hpi" --clobber

      - name: Update version in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Don't point the README at an older release when re-publishing one.
          latest=$(gh release view --json tagName -q .tagName)
          if [[ "$latest" != "$TAG" ]]; then
            echo "::notice::$TAG is not the latest release ($latest); skipping README update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2016 # git's helper shell must expand the token, not this one
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'

          # The tag checkout is a detached HEAD; commit on main instead.
          git checkout -B main origin/main

          sed -i -E "s|https://github.com/TwoStone/jenkins-pipeline-cache-plugin/releases/download/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.hpi|https://github.com/TwoStone/jenkins-pipeline-cache-plugin/releases/download/${TAG}/jenkins-pipeline-cache-${VERSION}.hpi|g" README.md

          if git diff --quiet README.md; then
            echo "::notice::README.md already up to date"
          else
            # Use the `chore` type so release-please does not treat this commit
            # as a releasable change and open a follow-up release PR.
            git add README.md
            git commit -m "chore(release): update README download link to v${VERSION}"
            git push
          fi
