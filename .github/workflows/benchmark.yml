name: Benchmark Comparison

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Branch, tag or SHA to compare against (the run ref is the head)'
        default: main
        required: true

permissions:
  contents: read

jobs:
  benchmark-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------------
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base SHA
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          BASE_SHA=$(git rev-parse --verify "origin/${BASE_REF}^{commit}" 2>/dev/null || git rev-parse --verify "${BASE_REF}^{commit}")
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-bench-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-bench-
            ${{ runner.os }}-maven-

      # Save the comparison script before switching to base (which may not have it)
      - name: Preserve comparison script
        run: cp .github/scripts/compare-benchmarks.py /tmp/compare-benchmarks.py

      # ------------------------------------------------------------------
      # Run benchmarks on the BASE branch (main)
      # ------------------------------------------------------------------
      - name: Checkout base ref
        run: git checkout "$BASE_SHA"

      - name: Run base benchmarks
        run: |
          mvn -B verify -Pbenchmarks 2>&1 | tee /tmp/benchmark-base-full.log \
            | grep -E '^\[BENCHMARK\]|Tests run:|BUILD' || true
          grep '^\[BENCHMARK\]' /tmp/benchmark-base-full.log > /tmp/base-results.txt 2>/dev/null || true
          echo "::group::Base benchmark results"
          cat /tmp/base-results.txt || true
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Run benchmarks on the PR HEAD
      # ------------------------------------------------------------------
      - name: Checkout head
        run: git checkout "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.sha }}

      - name: Run head benchmarks
        run: |
          mvn -B verify -Pbenchmarks 2>&1 | tee /tmp/benchmark-pr-full.log \
            | grep -E '^\[BENCHMARK\]|Tests run:|BUILD' || true
          grep '^\[BENCHMARK\]' /tmp/benchmark-pr-full.log > /tmp/pr-results.txt 2>/dev/null || true
          echo "::group::Head benchmark results"
          cat /tmp/pr-results.txt || true
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Compare results and build Markdown comment
      # ------------------------------------------------------------------
      - name: Compare benchmarks
        id: compare
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 /tmp/compare-benchmarks.py \
            /tmp/base-results.txt /tmp/pr-results.txt \
            | tee /tmp/benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"
